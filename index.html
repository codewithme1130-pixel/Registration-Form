<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1 style="color: rgb(32, 32, 82);">Student Regestration Form</h1>

    <label>Roll number: <input type="number" placeholder="Enter roll no"></label>
    <br> <br>
   <label>Student Name: <input type="text" placeholder="first name">-<input type="text" placeholder="last name"></label>
   <br><br>
   <label>Father's Name: <input type="text" placeholder="Enter name"></label>
    <br><br>
    <label>Date of birth: <input type="date"></label>
    <br><br>
    <label>Phone Number: <input type="number"></label>
    <br><br>
    <label>Email Id: <input type="email"></label>
    <br><br>
    <label>Password: <input type="password"></label>
    <br><br>
    <!-- type=radio -->
    <label>Gender: <input type="radio" name="gender" value="male">male</label>
    <label> <input type="radio" name="gender" value="female" >female</label>
    <label> <input type="radio" name="gender" value="other"> other</label>
    <br><br>
    <!-- type=checkbox -->
     <label>Department: <input type="checkbox" name="Department" value="CSE">CSE</label>
     <label> <input type="checkbox" name="Department" value="IT">IT</label>
     <label> <input type="checkbox" name="Department" value="Civil">Civil</label>
     <br><br>
     <label>Course: <input type="text" placeholder="Enter your course "></label>
     <br><br>
     <label>City: <input type="text" placeholder="Enter your city name"></label>
     <br><br>
     <label>Address: <textarea placeholder="Enter your address"></textarea></label>
     <br><br>
     <button>Submit</button>
</body>
   </html>
